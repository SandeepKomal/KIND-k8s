apiVersion: v1
kind: ResourceQuota
metadata:
  name: kind-demo-quota
  namespace: kind-demo
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 256Mi
    limits.cpu: "1"
    limits.memory: 512Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kind-demo-defaults
  namespace: kind-demo
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 10m
        memory: 16Mi
